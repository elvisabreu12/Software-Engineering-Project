<!DOCTYPE html>
<html>

<head>
    <title>WHT_RBT login</title>
    <link rel="stylesheet" href="loginpage.css">
</head>

<body>
    <div class="main">
        <h1>WHT_RBT</h1>

        <form id="login-form">
            <label for="email">
                Email:
            </label>
            <input type="email" id="email" name="email"
                placeholder="Enter your Email" required>

            <label for="password">
                Password:
            </label>
            <input type="password" id="password" name="password"
                placeholder="Enter your Password" required>

            <!-- Error messages from the backend show up here -->
            <div id="error" class="error" hidden></div>

            <div class="wrap">
                <button type="submit" id="submit-btn">
                    Submit
                </button>
            </div>
        </form>

        <p>Not registered?
            <a href="registerpage.html" style="text-decoration: none;">
                Create an account
            </a>
            </p>
            <p>
            <a href="homepage.html" style="text-decoration: none;">
                Home
            </a>
        </p>
    </div>

    <script src="app.js"></script>
    <script>
        // When the form is submitted: POST /login, save the token, go to the right dashboard
        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();                       // stop the page from reloading

            const button = document.getElementById("submit-btn");
            const error = document.getElementById("error");
            error.hidden = true;
            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                const data = await api("/login", {
                    method: "POST",
                    body: JSON.stringify({
                        user_email: document.getElementById("email").value,
                        user_password: document.getElementById("password").value,
                    }),
                });

                setToken(data.access_token);              // keep the token for later requests
                // Admins go to the admin dashboard, everyone else to the normal one
                window.location.href = data.access_level >= 3 ? "admin_Dash.html" : "user_Dash.html";
            } catch (e) {
                error.textContent = e.message;
                error.hidden = false;
                button.disabled = false;
                button.textContent = "Submit";
            }
        });
    </script>
</body>

</html>
