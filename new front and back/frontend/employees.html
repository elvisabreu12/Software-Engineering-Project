  <div class="main-container">
    <header>
      <div class="header-title">Employees</div>
    </header>
    <div class="content">
      <div class="ticket-section">
        <div class="section-head">
          <div>
            <h3>Employees (end users)</h3>
            <div class="section-sub" id="count" style="margin-bottom:0;">Loading...</div>
          </div>
          <input id="search" class="search" type="text" placeholder="Search name, email or team">
        </div>
        <!-- the table gets drawn in here by render() -->
        <div id="people"><div class="empty">Loading...</div></div>
      </div>
    </div>
  </div>

  <!-- shared code (api(), initPage(), esc()...) -->
  <script src="app.js"></script>
  <script>
    // people = the end users (employees)
    let people = [];
    // first letters of the first two words of the name, for the round avatar
    function initials(name) {
      return (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }
    // filters by what was typed (name, email or team) and builds the table
    function render() {
      const q = $("search").value.trim().toLowerCase();
      const list = people.filter((p) => !q || p.user_name.toLowerCase().includes(q) || (p.user_email || "").toLowerCase().includes(q) || (p.user_team || "").toLowerCase().includes(q));
      $("count").textContent = list.length + " of " + people.length + " shown";
      if (!list.length) { $("people").innerHTML = '<div class="empty">No employees found.</div>'; return; }
      $("people").innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Team</th><th>Role</th></tr></thead><tbody>' +
        list.map((u) =>
          '<tr><td class="muted">#' + esc(u.user_id) + '</td><td><div style="display:flex;align-items:center;gap:10px;"><span class="avatar" style="width:32px;height:32px;font-size:12px;">' + esc(initials(u.user_name)) + "</span>" +
          esc(u.user_name) + "</div></td><td>" + esc(u.user_email) + "</td><td>" + esc(u.user_team || "-") + "</td><td>" + esc(u.role) + "</td></tr>").join("") +
        "</tbody></table></div>";
    }
    (async function () {
      // this page is admins only
      const me = await initPage(3);          // admins only
      if (!me) return;
      try {
        // GET /users (admins only) -> keep the End Users (employees)
        people = (await api("/users")).filter((u) => u.role === "End User");
        render();
      } catch (e) { $("people").innerHTML = '<div class="msg error">' + esc(e.message) + "</div>"; }
    })();
    $("search").addEventListener("input", render);
  </script>
  <script src="chat-widget.js" data-api="http://127.0.0.1:8001/chat"></script>
</body>
</html>
