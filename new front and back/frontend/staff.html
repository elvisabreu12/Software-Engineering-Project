  <div class="main-container">
    <header>
      <div class="header-title">Staff</div>
    </header>
    <div class="content">
      <div class="ticket-section">
        <div class="section-head">
          <div>
            <h3>Administrators and agents</h3>
            <div class="section-sub" id="count" style="margin-bottom:0;">Loading...</div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <label class="tv-chip">Role: <select id="f-role"><option value="">All roles</option></select></label>
            <input id="search" class="search" type="text" placeholder="Search name, email or skill">
          </div>
        </div>
        <!-- the cards get drawn in here by render() -->
        <div id="people"><div class="empty">Loading...</div></div>
      </div>
    </div>
  </div>

  <!-- shared code (api(), initPage(), esc()...) -->
  <script src="app.js"></script>
  <script>
    // how wide the skill bar is for each level (as a % of the full bar)
    const LEVEL_WIDTH = { Beginner: 33, Intermediate: 66, Expert: 100 };
    // people = the administrators and agents, each one with their skills
    let people = [];

    // takes the first letter of the first two words of a name, like "Jane Doe" -> JD (used in the round avatar)
    function initials(name) {
      return (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }

    // makes the card for one person: avatar, name, role, email and a bar for each skill
    function card(p) {
      const skills = p.skills.length
        ? p.skills.map((s) =>
            '<div class="skill-bar"><div class="row"><span>' + esc(s.skill) + "</span><span>" + esc(s.level) +
            '</span></div><div class="track"><div class="fill" style="width:' + (LEVEL_WIDTH[s.level] || 33) + '%;"></div></div></div>').join("")
        : '<div class="section-sub" style="margin:0;">No skills listed.</div>';
      return '<div class="person-card"><div class="person-top"><div class="avatar">' + esc(initials(p.user_name)) + "</div>" +
        "<div><h3>" + esc(p.user_name) + '<span class="role-pill">' + esc(p.role) + "</span></h3><small>" + esc(p.user_email) +
        (p.user_team ? " · " + esc(p.user_team) : "") + "</small></div></div>" +
        "<div>" + skills + "</div>" +
        '<a class="btn-light" href="profile.html?id=' + esc(p.user_id) + '">View / edit skills</a></div>';
    }

    // filters the people by role and by what was typed (name, email or a skill), then draws the cards. some() checks if any of their skills match.
    function render() {
      const q = $("search").value.trim().toLowerCase();
      const role = $("f-role").value;
      const list = people.filter((p) =>
        (!role || p.role === role) &&
        (!q || p.user_name.toLowerCase().includes(q) || (p.user_email || "").toLowerCase().includes(q) ||
          p.skills.some((s) => s.skill.toLowerCase().includes(q))));
      $("count").textContent = list.length + " of " + people.length + " shown";
      $("people").innerHTML = list.length ? '<div class="person-grid">' + list.map(card).join("") + "</div>" : '<div class="empty">No one matches.</div>';
    }

    (async function () {
      // this page is admins only
      const me = await initPage(3);          // admins only
      if (!me) return;
      try {
        // GET /users (admins only) -> keep administrators and agents
        const users = (await api("/users")).filter((u) => u.role !== "End User");
        // GET /users/{id}/profile -> each person's skills and skill levels
        // Promise.all runs all the profile requests at the same time and waits for every one. If one fails, that person just gets no skills.
        people = await Promise.all(users.map(async (u) => {
          try { const p = await api("/users/" + encodeURIComponent(u.user_id) + "/profile"); return { ...u, skills: p.skills || [] }; }
          catch (e) { return { ...u, skills: [] }; }
        }));
        // fill the Role dropdown with the roles that exist. A Set removes the duplicates.
        const roles = [...new Set(people.map((p) => p.role))];
        $("f-role").innerHTML = '<option value="">All roles</option>' + roles.map((r) => "<option>" + esc(r) + "</option>").join("");
        render();
      } catch (e) { $("people").innerHTML = '<div class="msg error">' + esc(e.message) + "</div>"; }
    })();
    $("search").addEventListener("input", render);
    $("f-role").addEventListener("change", render);
  </script>
  <script src="chat-widget.js" data-api="http://127.0.0.1:8001/chat"></script>
</body>
