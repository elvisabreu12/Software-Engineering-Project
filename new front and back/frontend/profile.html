  <div class="main-container">
    <header>
      <div class="header-title" id="page-title">Profile</div>
    </header>
    <!-- render() fills this in once the profile is loaded -->
    <div class="content" id="content"><div class="empty">Loading...</div></div>
  </div>

  <!-- shared code (api(), initPage(), esc()...) -->
  <script src="app.js"></script>
  <script>
    // me = the logged in user, profile = the profile being shown, isOwn = true if it is my own profile
    let me = null, profile = null, isOwn = false;
    let categories = [];            // category names from GET /categories (the skill choices)
    // the skill levels the backend accepts
    const LEVELS = ["Beginner", "Intermediate", "Expert"];
    // how wide the skill bar is for each level
    const LEVEL_WIDTH = { Beginner: 33, Intermediate: 66, Expert: 100 };

    // first letters of the name for the round avatar
    function initials(name) {
      return (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }
    function flash(id, text, kind) {
      const box = $(id); box.className = "msg " + kind; box.textContent = text; box.hidden = false;
    }

    // One skill row: a dropdown of the ticket categories + a level dropdown + Remove
    function skillRow(s) {
      const names = categories.slice();
      // keep a skill that was saved earlier even if it is not a category name
      if (s.skill && !names.some((n) => n.toLowerCase() === s.skill.toLowerCase())) names.push(s.skill);
      return '<div class="field skill-row">' +
        '<select class="sk-name" aria-label="Skill" style="flex:1 1 200px;min-width:160px;">' +
        '<option value="">Select a category</option>' +
        names.map((n) => '<option value="' + esc(n) + '"' + (n.toLowerCase() === (s.skill || "").toLowerCase() ? " selected" : "") + ">" + esc(n) + "</option>").join("") +
        "</select>" +
        '<select class="sk-level" aria-label="Level" style="flex:0 0 150px;">' +
        LEVELS.map((l) => "<option" + (l === s.level ? " selected" : "") + ">" + l + "</option>").join("") +
        '</select><button type="button" class="btn-light sk-remove" aria-label="Remove skill">Remove</button></div>';
    }

    // Draws the whole page. My own profile has a form to edit the name and email. Someone else's is read only.
    // Staff also get a skills section. It has editable rows if it's my own profile or I am an admin, otherwise just bars.
    function render() {
      // only agents and admins have skills
      const staff = profile.access_level >= 2;
      $("page-title").textContent = isOwn ? "My Profile" : profile.user_name;
      let html =
        '<div class="ticket-section">' +
        '<div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;">' +
          '<div class="avatar lg">' + esc(initials(profile.user_name)) + "</div>" +
          "<div><h3>" + esc(profile.user_name) + '</h3><div class="section-sub" style="margin:0;">' + esc(profile.role) + "</div></div></div>";

      if (isOwn) {
        html +=
          '<form id="profile-form"><div class="two">' +
          '<div class="field"><label for="p-name">Name</label><input id="p-name" type="text" maxlength="100" value="' + esc(profile.user_name) + '" required></div>' +
          '<div class="field"><label for="p-email">Email</label><input id="p-email" type="text" value="' + esc(profile.user_email) + '" required></div>' +
          "</div>" +
          '<div class="field"><label for="p-role">Role</label><input id="p-role" type="text" value="' + esc(profile.role) + '" readonly></div>' +
          '<div id="profile-msg" class="msg" hidden></div>' +
          '<button class="btn-msg" type="submit">Save changes</button></form>';
      } else {
        html += '<div class="detail-grid"><div><small>Email</small>' + esc(profile.user_email) + "</div><div><small>Role</small>" + esc(profile.role) + "</div></div>";
      }
      html += "</div>";

      if (staff) {
        // agents can edit their own skills and admins can edit anyone's
        const canEdit = isOwn || me.access_level >= 3;
        html += '<div class="ticket-section"><h3>Skills</h3><div class="section-sub">Pick the kinds of issues this person can handle. Used to match new tickets to the right technician.</div>';
        if (canEdit) {
          html += '<div id="skills">' + profile.skills.map(skillRow).join("") + "</div>" +
            '<div id="skills-msg" class="msg" hidden></div>' +
            '<div class="actions"><button type="button" id="add-skill" class="btn-light">+ Add skill</button>' +
            '<button type="button" id="save-skills" class="btn-msg">Save skills</button></div>';
        } else if (!profile.skills.length) {
          html += '<div class="empty">No skills listed.</div>';
        } else {
          html += profile.skills.map((s) =>
            '<div class="skill-bar"><div class="row"><span>' + esc(s.skill) + '</span><span>' + esc(s.level) +
            '</span></div><div class="track"><div class="fill" style="width:' + (LEVEL_WIDTH[s.level] || 33) + '%;"></div></div></div>').join("");
        }
        html += "</div>";
      }
      // the form and buttons only exist after this line, so the code after it connects to them
      $("content").innerHTML = html;

      // save the name and email with PATCH /profile, then draw the page again
      if ($("profile-form")) $("profile-form").onsubmit = async (ev) => {
        ev.preventDefault();
        try {
          profile = await api("/profile", { method: "PATCH", body: JSON.stringify({ user_name: $("p-name").value, user_email: $("p-email").value }) });
          $("me-name").textContent = profile.user_name;
          render(); flash("profile-msg", "Profile saved.", "ok");
        } catch (e) { flash("profile-msg", e.message, "error"); }
      };
      if ($("add-skill")) {
        // + Add skill adds one more empty row
        $("add-skill").onclick = () => $("skills").insertAdjacentHTML("beforeend", skillRow({ skill: "", level: "Intermediate" }));
        // the Remove button deletes its row
        $("skills").addEventListener("click", (ev) => { const b = ev.target.closest(".sk-remove"); if (b) b.closest(".skill-row").remove(); });
        // collects every row (skipping empty ones) and sends the whole list. The backend replaces the old skills with it.
        $("save-skills").onclick = async () => {
          const skills = [...document.querySelectorAll(".skill-row")].map((r) => ({
            skill: r.querySelector(".sk-name").value, level: r.querySelector(".sk-level").value })).filter((s) => s.skill.trim());
          try {
            profile = await api("/users/" + profile.user_id + "/skills", { method: "PUT", body: JSON.stringify({ skills }) });
            render(); flash("skills-msg", "Skills saved.", "ok");
          } catch (e) { flash("skills-msg", e.message, "error"); }
        };
      }
    }

    (async function () {
      me = await initPage(1);
      if (!me) return;
      // if there is an ?id= in the address and it's not me, show that person's profile. Otherwise show my own.
      const id = new URLSearchParams(location.search).get("id");
      try {
        // GET /categories -> the list of issue types used for the skill dropdown
        try { categories = (await api("/categories")).map((c) => c.category_name); } catch (e) {}
        profile = id && Number(id) !== me.user_id ? await api("/users/" + encodeURIComponent(id) + "/profile") : await api("/profile");
        isOwn = profile.user_id === me.user_id;
        render();
      } catch (e) { $("content").innerHTML = '<div class="msg error">' + esc(e.message) + "</div>"; }
    })();
  </script>
