<!DOCTYPE html>
<html>

<head>
    <title>WHT_RBT login</title>
    <link rel="stylesheet" href="loginpage.css">
</head>

<body>
    <div class="main">
        <h1>WHT_RBT</h1>

        <form action="">
            <label for="first">
                Username:
            </label>
            <input type="text" id="first" name="first" 
                placeholder="Enter your Username" required>

            <label for="password">
                Password:
            </label>
            <input type="password" id="password" name="password" 
                placeholder="Enter your Password" required>

            <div class="wrap">
                <button type="submit">
                    Submit
                </button>
            </div>
        </form>
        
        <p>Not registered?
            <a href="registerpage.html" style="text-decoration: none;">
                Create an account
            </a>
            </p>
            <p>
            <a href="homepage.html" style="text-decoration: none;">
                Home
            </a>
        </p>
    </div>
</body>

</html>
